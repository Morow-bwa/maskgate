name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.1"
          python -m pip install -e ".[dev,media]"
      - name: Lint
        run: python -m ruff check app scripts
      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Audit Python dependencies
        run: python -m pip_audit --local
      - name: Verify production lock
        run: |
          python -m uv pip compile pyproject.toml --extra media --universal --output-file requirements.check.lock
          tail -n +3 requirements.lock > /tmp/requirements.expected
          tail -n +3 requirements.check.lock > /tmp/requirements.actual
          diff --strip-trailing-cr /tmp/requirements.expected /tmp/requirements.actual
      - name: Scan tracked files for credential patterns
        run: python scripts/check_secrets.py --history

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground-react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: playground-react/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit --audit-level high

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: playground-react/pnpm-lock.yaml
      - run: python -m pip install -e ".[dev,media]"
      - run: python -m playwright install --with-deps chromium
      - run: pnpm --dir playground-react install --frozen-lockfile
      - run: pnpm --dir playground-react build
      - name: Run browser smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/maskgate.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health/live && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health/live
          python scripts/browser_smoke.py --url http://127.0.0.1:8080/playground

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: maskgate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
